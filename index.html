    <!--
      THESIS: LabFlow is a calm shared flow board for a research lab, refusing the cluttered all-widgets-at-once default.
      OWN-WORLD: clean paper, quiet ink, muted blue-green status color, compact lists, restrained progress signals, editable controls.
      STORY: members see what matters today, understand project health, and update ownership, priority, comments, files, and checklists.
      FIRST VIEWPORT: a compact top command bar, a left project rail, a main task flow, and a narrow daily summary.
      FORM: quieted code-led MVP direction, shaped from the lab's daily rituals and refresh-based collaboration.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->

    <script src="config.js"></script>
    <script src="app.js"></script>
